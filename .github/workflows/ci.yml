name: verification
on:
  push:
    branches: [main, feature/persistent-document-review]
  pull_request:

jobs:
  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install native OCR and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version
          pip install -r server/requirements-dev.txt
      - name: Reproduce synthetic training and separate evaluation
        run: |
          python training/generate_corpus.py
          python training/train.py
          python evaluation/evaluate.py
      - name: Python unit, API, restart, concurrency, PDF and native OCR tests
        working-directory: server
        run: python -m pytest -q -ra
      - name: Install frontend and browser
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Frontend typecheck and build
        working-directory: ui
        run: |
          npm run typecheck
          npm run build
      - name: Browser workflow against real backend and frontend
        working-directory: ui
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            evaluation/results.json
            server/doc_intake_service/model/metrics.json
            ui/test-results/
            ui/playwright-report/
