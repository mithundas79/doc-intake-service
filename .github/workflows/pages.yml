name: Publish guided sample preview

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "samples/*.txt"
      - "ui/package*.json"
      - "ui/playwright.demo.config.ts"
      - "ui/e2e-demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
  deploy:
    # Publishing is limited to the default branch. Environment protection rules
    # remain authoritative; a manual build from a feature branch cannot deploy.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    name: Verify published fictional preview
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install browser test dependencies
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise the published preview on desktop and mobile
        working-directory: ui
        env:
          PUBLISHED_DEMO_URL: https://mithundas79.github.io/doc-intake-service/
        run: npm run test:demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-demo-verification
          path: ui/test-results-demo-live/
